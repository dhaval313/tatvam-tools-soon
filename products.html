    // ========== GALLERY FUNCTIONS ==========
    function showGallerySlide(index) {
        const mainContainer = document.querySelector('.gallery-main');

        // Remove existing video if playing
        const existingVideo = mainContainer.querySelector('video');
        if (existingVideo) {
            existingVideo.pause();
            existingVideo.remove();
        }

        // If there are no slides, show "Coming Soon" placeholder
        if (!currentGallerySlides || currentGallerySlides.length === 0) {
            currentGallerySlideIndex = 0;
            let mainImage = document.getElementById('detailMainImage');
            if (mainImage) mainImage.style.display = 'none';

            // Check if placeholder is already rendered, otherwise create it
            let placeholder = mainContainer.querySelector('.image-placeholder');
            if (!placeholder) {
                placeholder = document.createElement('div');
                placeholder.className = 'image-placeholder';
                placeholder.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:60px;height:60px;opacity:0.5;">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                    <span style="font-size:0.9rem;font-weight:500;">Image Coming Soon</span>
                `;
                mainContainer.insertBefore(placeholder, mainContainer.firstChild);
            }

            // Hide thumbs and next/prev arrows
            const thumbsContainer = document.querySelector('.gallery-thumbs');
            if (thumbsContainer) thumbsContainer.style.display = 'none';

            const prevBtn = document.querySelector('.gallery-nav-btn.prev');
            const nextBtn = document.querySelector('.gallery-nav-btn.next');
            if (prevBtn && nextBtn) {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }
            return;
        }

        // If slides exist, ensure thumbs container is visible
        const thumbsContainer = document.querySelector('.gallery-thumbs');
        if (thumbsContainer) thumbsContainer.style.display = 'flex';

        // Remove placeholder if present
        const placeholder = mainContainer.querySelector('.image-placeholder');
        if (placeholder) placeholder.remove();

        currentGallerySlideIndex = index;
        const slide = currentGallerySlides[index];
        let mainImage = document.getElementById('detailMainImage');
        if (slide.type === 'video') {
            if (mainImage) mainImage.style.display = 'none';

            const video = document.createElement('video');
            video.src = slide.src;
            video.controls = true;
            video.autoplay = true;
            video.loop = true;
            video.muted = true;
            video.style.cssText = 'width:100%;height:100%;object-fit:contain;padding:1rem;cursor:pointer;';
            video.onclick = function () { openLightbox(slide.src, true); };
            mainContainer.appendChild(video);
        } else {
            if (!mainImage) {
                mainImage = document.createElement('img');
                mainImage.id = 'detailMainImage';
                mainImage.onclick = function () { openLightbox(this.src); };
                mainContainer.insertBefore(mainImage, mainContainer.firstChild);
            }
            mainImage.src = slide.src;
            mainImage.alt = slide.alt;
            mainImage.style.display = 'block';
        }

        // Update active class in thumbnails and scroll it into view
        const thumbs = document.querySelectorAll('.gallery-thumbs .thumb');
        thumbs.forEach((thumb, i) => {
            const isActive = i === index;
            thumb.classList.toggle('active', isActive);
            if (isActive) {
                thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });

        // Hide navigation buttons if there is only 1 slide
        const prevBtn = document.querySelector('.gallery-nav-btn.prev');
        const nextBtn = document.querySelector('.gallery-nav-btn.next');
        if (prevBtn && nextBtn) {
            const displayStyle = currentGallerySlides.length <= 1 ? 'none' : 'flex';
            prevBtn.style.display = displayStyle;
            nextBtn.style.display = displayStyle;
        }
    }

    function slideGalleryImage(direction) {
        if (currentGallerySlides.length <= 1) return;
        let newIndex = currentGallerySlideIndex + direction;
        if (newIndex < 0) newIndex = currentGallerySlides.length - 1;
        if (newIndex >= currentGallerySlides.length) newIndex = 0;

        showGallerySlide(newIndex);
    }

    // ========== LIGHTBOX & ZOOM ==========
    let zoomState = { scale: 1, x: 0, y: 0 };
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function initLightboxZoom() {
        const wrapper = document.getElementById('lightbox-image-wrapper');
        const img = document.getElementById('lightbox-image');

        // Mouse Wheel Zoom
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.2 : 0.2;
            let newScale = zoomState.scale + delta;
            newScale = Math.min(Math.max(1, newScale), 5); // Clamp between 1x and 5x

            zoomState.scale = newScale;

            if (newScale === 1) {
                zoomState.x = 0;
                zoomState.y = 0;
                wrapper.style.cursor = 'default';
            } else {
                wrapper.style.cursor = 'grab';
            }

            updateImageTransform();
        });

        // Drag Start
        wrapper.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('lightbox-close')) return; // Don't drag when clicking close
            if (zoomState.scale > 1) {
                isDragging = true;
                startX = e.clientX - zoomState.x;
                startY = e.clientY - zoomState.y;
                wrapper.style.cursor = 'grabbing';
                e.preventDefault();
            }
        });

        // Drag Move
        window.addEventListener('mousemove', (e) => {
            if (isDragging && zoomState.scale > 1) {
                e.preventDefault();
                zoomState.x = e.clientX - startX;
                zoomState.y = e.clientY - startY;
                updateImageTransform();
            }
        });

        // Drag End
        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                const wrapper = document.getElementById('lightbox-image-wrapper');
                if (zoomState.scale > 1) wrapper.style.cursor = 'grab';
            }
        });
    }

    function updateImageTransform() {
        const wrapper = document.getElementById('lightbox-image-wrapper');
        wrapper.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
    }

    function resetZoom() {
        zoomState = { scale: 1, x: 0, y: 0 };
        isDragging = false;
        updateImageTransform();
        const wrapper = document.getElementById('lightbox-image-wrapper');
        if (wrapper) wrapper.style.cursor = 'default';
    }

                // If currentSelectedSize is 'all', we show only general ('all') images
                if (currentSelectedSize === 'all') {

        const items = filteredImages.map(img => ({

            items.push({

                let lengthOptionsHtml = `

                ` + filteredLengths.map(l => {
                    const displayLabel = l.includes('6x6x6') ? '12" (6x6x6)' : `${l}"`;
                    return `<button class="length-pill" data-length="${l}" onclick="filterGalleryByLength('${l}')">${displayLabel}</button>`;
                }).join('');

                lengthContainer.innerHTML = `
                    <span class="selector-label">Filter by Length:</span>
                    <div class="selector-options">
                        ${lengthOptionsHtml}
                    </div>
                `;
            }
        }

        // 3. Filter images to display in thumbnails
        const filteredImages = size === 'all'
            ? currentActiveProduct.images.filter(img => img.size === 'all')
            : currentActiveProduct.images.filter(img => img.size === size);

        // 4. Build active slides list for navigation
        currentGallerySlides = filteredImages.map(img => ({
            type: 'image',
            src: `assets/images/products/${currentActiveProduct.folder}/${img.src}`,
            alt: img.alt
        }));
        if (size === 'all' && currentActiveProduct.video) {
            currentGallerySlides.push({
                type: 'video',
                src: `assets/images/products/${currentActiveProduct.folder}/${currentActiveProduct.video}`,
                alt: 'Product Video'
            });
        }
        currentGallerySlideIndex = 0;

        // 5. Re-render thumbnails calling showGallerySlide(index)
        const thumbsContainer = document.querySelector('.gallery-thumbs');
        if (thumbsContainer) {
            let galleryImagesHtml = filteredImages.map((img, index) => {
                const imgPath = `assets/images/products/${currentActiveProduct.folder}/${img.src}`;
                return `<img src="${imgPath}" alt="${img.alt}" class="thumb ${index === 0 ? 'active' : ''}" 
                            onclick="showGallerySlide(${index})">`;
            }).join('');

            // Add video thumb if exists and we are in "all"
            const videoThumb = (size === 'all' && currentActiveProduct.video) ? `
                    <div class="video-thumb thumb" onclick="showGallerySlide(${filteredImages.length})">
                        <img src="assets/images/products/${currentActiveProduct.folder}/${currentActiveProduct.images[0]?.src || ''}" 
                             alt="Video Preview" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">
                    </div>
                ` : '';

            thumbsContainer.innerHTML = galleryImagesHtml + videoThumb;
        }

        // 6. Show first slide and update navigation buttons
        showGallerySlide(0);
    }

    function filterGalleryByLength(length) {
        currentSelectedLength = length;

        // 1. Update active class on pills
        document.querySelectorAll('.length-pill').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-length') === length);
        });

        // 2. Filter images by both size and length
        const filteredImages = length === 'all'
            ? currentActiveProduct.images.filter(img => img.size === currentSelectedSize)
            : currentActiveProduct.images.filter(img => img.size === currentSelectedSize && img.length === length);

        // 3. Build active slides list for navigation
        currentGallerySlides = filteredImages.map(img => ({
            type: 'image',
            src: `assets/images/products/${currentActiveProduct.folder}/${img.src}`,
            alt: img.alt
        }));
        currentGallerySlideIndex = 0;

        // 4. Re-render thumbnails calling showGallerySlide(index)
        const thumbsContainer = document.querySelector('.gallery-thumbs');
        if (thumbsContainer) {
            let galleryImagesHtml = filteredImages.map((img, index) => {
                const imgPath = `assets/images/products/${currentActiveProduct.folder}/${img.src}`;
                return `<img src="${imgPath}" alt="${img.alt}" class="thumb ${index === 0 ? 'active' : ''}" 
                            onclick="showGallerySlide(${index})">`;
            }).join('');

            thumbsContainer.innerHTML = galleryImagesHtml;
        }

        // 5. Show first slide and update navigation buttons
        showGallerySlide(0);
    }

    function openLightbox(src, isVideo = false) {
        const lightbox = document.getElementById('lightbox');

        // Prepare playlist
        currentLightboxMedia = prepareLightboxMedia();

        // Find index of current src
        currentLightboxIndex = currentLightboxMedia.findIndex(item => {
            return src.includes(item.src) || (item.type === 'video' && src.includes(item.src));
        });

        if (currentLightboxIndex === -1) currentLightboxIndex = 0;

        // Build the bottom thumbnail track
        buildLightboxThumbnails();

        updateLightboxContent(currentLightboxMedia[currentLightboxIndex]);
        updateNavButtons();

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function buildLightboxThumbnails() {
        const thumbsContainer = document.getElementById('lightbox-thumbs');
        if (!thumbsContainer) return;

        if (currentLightboxMedia.length <= 1) {
            thumbsContainer.parentElement.style.display = 'none';
            return;
        }
        thumbsContainer.parentElement.style.display = 'flex';

        thumbsContainer.innerHTML = currentLightboxMedia.map((item, index) => {
            if (item.type === 'video') {
                return `
                    <div class="lightbox-thumb-item video-thumb" onclick="jumpToLightboxImage(${index})" data-index="${index}">
                        <svg viewBox="0 0 24 24" fill="currentColor" style="width: 20px; height: 20px; color: white;">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                    </div>
                `;
            } else {
                return `
                    <div class="lightbox-thumb-item" onclick="jumpToLightboxImage(${index})" data-index="${index}">
                        <img src="${item.src}" alt="Thumbnail ${index + 1}">
                    </div>
                `;
            }
        }).join('');
    }

    function jumpToLightboxImage(index) {
        if (index < 0 || index >= currentLightboxMedia.length) return;
        currentLightboxIndex = index;
        updateLightboxContent(currentLightboxMedia[index]);
    }

    function updateLightboxContent(item) {
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxVideo = document.getElementById('lightbox-video');

        if (item.type === 'video') {
            lightboxImage.style.display = 'none';
            lightboxVideo.style.display = 'block';
            lightboxVideo.src = item.src;
            lightboxVideo.play();
        } else {
            lightboxVideo.style.display = 'none';
            lightboxVideo.pause();
            lightboxImage.style.display = 'block';
            lightboxImage.src = item.src;
            resetZoom();
        }

        // Update textual counter
        const counter = document.getElementById('lightbox-counter');
        if (counter) {
            counter.textContent = `${currentLightboxIndex + 1} / ${currentLightboxMedia.length}`;
        }

        // Update active class on lightbox thumbnails
        const thumbs = document.querySelectorAll('#lightbox-thumbs .lightbox-thumb-item');
        thumbs.forEach((thumb, idx) => {
            const isActive = idx === currentLightboxIndex;
            thumb.classList.toggle('active', isActive);
            if (isActive) {
                thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });
    }

    function updateNavButtons() {
        const prevBtn = document.querySelector('.lightbox-prev');
        const nextBtn = document.querySelector('.lightbox-next');

        if (currentLightboxMedia.length <= 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
        }
    }

    function nextImage() {
        if (currentLightboxMedia.length <= 1) return;
        currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxMedia.length;
        updateLightboxContent(currentLightboxMedia[currentLightboxIndex]);
    }

    function prevImage() {
        if (currentLightboxMedia.length <= 1) return;
        currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxMedia.length) % currentLightboxMedia.length;
        updateLightboxContent(currentLightboxMedia[currentLightboxIndex]);
    }

    // Keyboard Navigation
    document.addEventListener('keydown', function (e) {
        if (!document.getElementById('lightbox').classList.contains('active')) return;

        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
    });

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        const lightboxVideo = document.getElementById('lightbox-video');
        lightbox.classList.remove('active');
        lightboxVideo.pause();
        document.body.style.overflow = '';
    }

    // Close lightbox on overlay click
    document.getElementById('lightbox').addEventListener('click', function (e) {
        if (e.target === this) closeLightbox();
    });

    // Close on Escape key
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
    });

    // Handle browser back/forward buttons
    window.addEventListener('popstate', function (e) {
        if (e.state && e.state.productId) {
            showProductDetail(e.state.productId);
        } else {
            showCatalog();
        }
    });

    // Check URL hash on page load
    function checkUrlHash() {
        const hash = window.location.hash.substring(1);
        if (hash) {
            const product = products.find(p => p.id === hash);
            if (product) {
                showProductDetail(hash);
            }
        }
    }

    // Swipe gestures support for lightbox mobile view
    let touchStartX = 0;
    let touchEndX = 0;
    let touchStartY = 0;
    let touchEndY = 0;

    function initLightboxSwipe() {
        const lightbox = document.getElementById('lightbox');
        if (!lightbox) return;

        lightbox.addEventListener('touchstart', (e) => {
            if (zoomState.scale > 1) return;
            
            const target = e.target;
            if (target.closest('.lightbox-close') || target.closest('.lightbox-prev') || target.closest('.lightbox-next') || target.closest('#lightbox-thumbs') || target.closest('video')) {
                return;
            }

            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        lightbox.addEventListener('touchend', (e) => {
            if (zoomState.scale > 1) return;

            const target = e.target;
            if (target.closest('.lightbox-close') || target.closest('.lightbox-prev') || target.closest('.lightbox-next') || target.closest('#lightbox-thumbs') || target.closest('video')) {
                return;
            }

            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });
    }

    function handleSwipe() {
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        const threshold = 50;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
            if (diffX > 0) {
                prevImage();
            } else {
                nextImage();
            }
        }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', function () {
        renderProductCards();
        checkUrlHash();
        initLightboxZoom();
        initLightboxSwipe();
    });
</script>
