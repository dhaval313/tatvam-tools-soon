    function renderProductCards() {
        const grid = document.getElementById('productsGrid');
        grid.innerHTML = products.map((product, index) => {
            const imagePath = product.coverImage
                ? `assets/images/products/${product.folder}/${product.coverImage}`
                : null;

            return `
                    <div class="product-card" onclick="showProductDetail('${product.id}')" style="animation-delay: ${index * 0.1}s">
                        <div class="product-card-image">
                            ${imagePath ?
                    `<img src="${imagePath}" alt="${product.name}" loading="lazy">` :
                    `<div class="image-placeholder-card">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                        <circle cx="8.5" cy="8.5" r="1.5" />
                                        <polyline points="21 15 16 10 5 21" />
                                    </svg>
                                    <span>Image Coming Soon</span>
                                </div>`
                }
                        </div>
                        <div class="product-card-content">
                            <h3>${product.name}</h3>
                            <p>${product.shortDesc}</p>
                            <div class="product-card-footer">
                                <span class="view-details">
                                    View Details
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M5 12h14M12 5l7 7-7 7" />
                                    </svg>
                                </span>

                        </div>
                    </div>
                `;
        }).join('');
    }

                         alt="Video Preview" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">

                <div class="feature-item">
                    <span class="feature-label">${spec.label}</span>
                    <span class="feature-value">${spec.value}</span>
                </div>

        // Main image

            ? `assets/images/products/${product.folder}/${product.coverImage}`
            : '';

        content.innerHTML = `
                <div class="section-header">
                    <h2 class="section-title">${product.name}</h2>
                </div>
                <div class="product-showcase">
                    <div class="product-left">
                        <div class="product-gallery">
                            <div class="gallery-main">
                                ${mainImageSrc ?
                `<img src="${mainImageSrc}" alt="${product.name}" id="detailMainImage" onclick="openLightbox(this.src)">` :
                `<div class="image-placeholder">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                                            <circle cx="8.5" cy="8.5" r="1.5" />
                                            <polyline points="21 15 16 10 5 21" />
                                        </svg>
                                        <span>Image Coming Soon</span>
                                    </div>`
            }
                            </div>
                            ${product.images.length > 0 ? `
                                <div class="gallery-thumbs">
                                    ${galleryImages}
                                    ${videoThumb}
                                </div>
                            ` : ''}
                        </div>
                        <div class="product-info-cards">
                            ${specsHtml}
                        </div>
                    </div>
                    <div class="product-details">
                        <h3>${product.name}</h3>
                        <div class="product-description-wrapper">
                            <p class="product-description">
                                ${product.description || 'Product description coming soon. Contact us for detailed specifications and information about this product.'}
                            </p>
                        </div>
                        <div class="product-actions">
                            <a href="contact.html" class="btn-primary">
                                <span>Request Quote</span>
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14M12 5l7 7-7 7" />
                                </svg>
                            </a>
                            <a href="tel:9924361415" class="btn-secondary">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                                </svg>
                                <span>Call Now</span>
                            </a>
                        </div>
                    </div>
                </div>
            `;

        // Scroll to top of page
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Update URL hash for bookmarking/sharing
        history.pushState({ productId }, '', `#${productId}`);
    }

    // ========== SHOW CATALOG (Back Button) ==========
    function showCatalog() {
        document.getElementById('catalog').style.display = 'block';
        document.getElementById('cta').style.display = 'block';
        document.getElementById('productDetail').style.display = 'none';

        // Stop any playing video
        const video = document.querySelector('.gallery-main video');
        if (video) {
            video.pause();
            video.remove();
        }

        // Scroll to catalog
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // Update URL
        history.pushState({}, '', 'products.html');
    }

    // ========== GALLERY FUNCTIONS ==========
    function changeDetailImage(thumb, src) {
        const mainContainer = document.querySelector('.gallery-main');
        let mainImage = document.getElementById('detailMainImage');

        // Remove video if exists
        const existingVideo = mainContainer.querySelector('video');
        if (existingVideo) {
            existingVideo.pause();
            existingVideo.remove();
            if (!mainImage) {
                mainImage = document.createElement('img');
                mainImage.id = 'detailMainImage';
                mainImage.onclick = function () { openLightbox(this.src); };
                mainContainer.insertBefore(mainImage, mainContainer.firstChild);
            }
            mainImage.style.display = 'block';
        }

        if (mainImage) {
            mainImage.src = src;
            document.querySelectorAll('.gallery-thumbs .thumb').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
        }
    }

    function changeToDetailVideo(videoSrc) {
        const mainContainer = document.querySelector('.gallery-main');
        const mainImage = document.getElementById('detailMainImage');

        if (mainImage) mainImage.style.display = 'none';

        const existingVideo = mainContainer.querySelector('video');
        if (existingVideo) existingVideo.remove();

        const video = document.createElement('video');
        video.src = videoSrc;
        video.controls = true;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.style.cssText = 'width:100%;height:100%;object-fit:contain;padding:1rem;cursor:pointer;';
        video.onclick = function () { openLightbox(videoSrc, true); };
        mainContainer.appendChild(video);

        document.querySelectorAll('.gallery-thumbs .thumb').forEach(t => t.classList.remove('active'));
        document.querySelector('.video-thumb')?.classList.add('active');
    }

    // ========== LIGHTBOX & ZOOM ==========
    let zoomState = { scale: 1, x: 0, y: 0 };
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function initLightboxZoom() {
        const wrapper = document.getElementById('lightbox-image-wrapper');
        const img = document.getElementById('lightbox-image');

        // Mouse Wheel Zoom
        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.2 : 0.2;
            let newScale = zoomState.scale + delta;
            newScale = Math.min(Math.max(1, newScale), 5); // Clamp between 1x and 5x

            zoomState.scale = newScale;

            if (newScale === 1) {
                zoomState.x = 0;
                zoomState.y = 0;
                wrapper.style.cursor = 'default';
            } else {
                wrapper.style.cursor = 'grab';
            }

            updateImageTransform();
        });

        // Drag Start
        wrapper.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('lightbox-close')) return; // Don't drag when clicking close
            if (zoomState.scale > 1) {
                isDragging = true;
                startX = e.clientX - zoomState.x;
                startY = e.clientY - zoomState.y;
                wrapper.style.cursor = 'grabbing';
                e.preventDefault();
            }
        });

        // Drag Move
        window.addEventListener('mousemove', (e) => {
            if (isDragging && zoomState.scale > 1) {
                e.preventDefault();
                zoomState.x = e.clientX - startX;
                zoomState.y = e.clientY - startY;
                updateImageTransform();
            }
        });

        // Drag End
        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                const wrapper = document.getElementById('lightbox-image-wrapper');
                if (zoomState.scale > 1) wrapper.style.cursor = 'grab';
            }
        });
    }

    function updateImageTransform() {
        const wrapper = document.getElementById('lightbox-image-wrapper');
        wrapper.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
    }

    function resetZoom() {
        zoomState = { scale: 1, x: 0, y: 0 };
        isDragging = false;
        updateImageTransform();
        const wrapper = document.getElementById('lightbox-image-wrapper');
        if (wrapper) wrapper.style.cursor = 'default';
    }
    function prepareLightboxMedia() {
        if (!currentActiveProduct) return [];
        const folder = currentActiveProduct.folder;
        const items = currentActiveProduct.images.map(img => ({
            type: 'image',
            src: `assets/images/products/${folder}/${img.src}`,
            alt: img.alt
        }));
        if (currentActiveProduct.video) {
            items.push({
                type: 'video',
                src: `assets/images/products/${folder}/${currentActiveProduct.video}`,
                alt: 'Product Video'
            });
        }
        return items;
    }

    function openLightbox(src, isVideo = false) {
        const lightbox = document.getElementById('lightbox');

        // Prepare playlist
        currentLightboxMedia = prepareLightboxMedia();

        // Find index of current src
        // Note: src passed in might vary (absolute vs relative), so check carefully
        // The src passed to openLightbox is usually from the DOM (this.src), which is absolute.
        // Our prepared items act as source of truth.
        // We will try to match by filename if absolute match fails.

        currentLightboxIndex = currentLightboxMedia.findIndex(item => {
            // Simple check if src ends with item.src (handling relative/absolute diff)
            // or exact match if possible
            return src.includes(item.src) || (item.type === 'video' && src.includes(item.src));
        });

        if (currentLightboxIndex === -1) currentLightboxIndex = 0;

        updateLightboxContent(currentLightboxMedia[currentLightboxIndex]);
        updateNavButtons();

        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function updateLightboxContent(item) {
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxVideo = document.getElementById('lightbox-video');

        if (item.type === 'video') {
            lightboxImage.style.display = 'none';
            lightboxVideo.style.display = 'block';
            lightboxVideo.src = item.src;
            lightboxVideo.play();
        } else {
            lightboxVideo.style.display = 'none';
            lightboxVideo.pause();
            lightboxImage.style.display = 'block';
            lightboxImage.src = item.src;
            resetZoom();
        }
    }

    function updateNavButtons() {
        const prevBtn = document.querySelector('.lightbox-prev');
        const nextBtn = document.querySelector('.lightbox-next');

        if (currentLightboxMedia.length <= 1) {
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
        } else {
            prevBtn.style.display = 'flex';
            nextBtn.style.display = 'flex';
        }
    }

    function nextImage() {
        if (currentLightboxMedia.length <= 1) return;
        currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxMedia.length;
        updateLightboxContent(currentLightboxMedia[currentLightboxIndex]);
    }

    function prevImage() {
        if (currentLightboxMedia.length <= 1) return;
        currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxMedia.length) % currentLightboxMedia.length;
        updateLightboxContent(currentLightboxMedia[currentLightboxIndex]);
    }

    // Keyboard Navigation
    document.addEventListener('keydown', function (e) {
        if (!document.getElementById('lightbox').classList.contains('active')) return;

        if (e.key === 'ArrowLeft') prevImage();
        if (e.key === 'ArrowRight') nextImage();
    });

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        const lightboxVideo = document.getElementById('lightbox-video');
        lightbox.classList.remove('active');
        lightboxVideo.pause();
        document.body.style.overflow = '';
    }

    // Close lightbox on overlay click
    document.getElementById('lightbox').addEventListener('click', function (e) {
        if (e.target === this) closeLightbox();
    });

    // Close on Escape key
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
    });

    // Handle browser back/forward buttons
    window.addEventListener('popstate', function (e) {
        if (e.state && e.state.productId) {
            showProductDetail(e.state.productId);
        } else {
            showCatalog();
        }
    });

    // Check URL hash on page load
    function checkUrlHash() {
        const hash = window.location.hash.substring(1);
        if (hash) {
            const product = products.find(p => p.id === hash);
            if (product) {
                showProductDetail(hash);
            }
        }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', function () {
        renderProductCards();
        checkUrlHash();
        initLightboxZoom();
    });
</script>
